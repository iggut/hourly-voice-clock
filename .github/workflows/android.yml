name: Android CI

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Download and sanitize Sherpa-ONNX AAR
        run: |
          set -eux
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-1.13.3.aar"
          cd app/libs
          mkdir -p sanitize
          cd sanitize
          unzip -q ../sherpa-onnx-1.13.3.aar
          # The AAR ships classes.jar as a file at the top level, NOT
          # as a `classes/` directory. Create the directory ourselves
          # before extracting the jar into it.
          mkdir -p classes
          cd classes
          jar xf ../classes.jar
          cd ..
          rm -f \
            com/k2fsa/sherpa/onnx/OfflineTtsConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsVitsModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsMatchaModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsKokoroModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsZipVoiceModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsKittenModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsPocketModelConfig.class \
            com/k2fsa/sherpa/onnx/OfflineTtsSupertonicModelConfig.class
          jar cf ../classes.jar .
          cd ..
          rm -rf classes
          zip -q ../sherpa-onnx-1.13.3-sanitized.aar classes.jar AndroidManifest.xml jni/*/*
          cd ..
          rm -rf sanitize sherpa-onnx-1.13.3.aar
          ls -la app/libs/sherpa-onnx-1.13.3-sanitized.aar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename release APK and compute checksum
        id: rename
        run: |
          VERSION_TAG="${{ inputs.version_tag || github.ref_name }}"
          APK_NAME="hourly-voice-clock-${VERSION_TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "renamed_apk=$APK_NAME" >> $GITHUB_OUTPUT
          echo "sha_file=${APK_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-checksum
          path: hourly-voice-clock-*-release.apk.sha256

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html

      - name: Create GitHub Release
        # Best-effort: a 401 from the release API (auth scope, missing
        # tag, etc.) must not fail the job. The release APK is already
        # uploaded as an artifact above, so the build is recoverable
        # even when the GitHub Release step cannot complete.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.version_tag }}
          name: Release ${{ steps.rename.outputs.version_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ${{ steps.rename.outputs.renamed_apk }}
            ${{ steps.rename.outputs.sha_file }}
          draft: true
          prerelease: false
